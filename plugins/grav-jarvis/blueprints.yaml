name: Jarvis
slug: grav-jarvis
type: plugin
version: 0.3.0
description: Reliable, cost-aware Jarvis assistance and review-first page editing for Grav 2 Admin2.
icon: microchip
author:
  name: Craig Daters
  email: craig@daters.net
homepage: https://github.com/cdaters/grav-extensions/tree/main/plugins/grav-jarvis
keywords: grav, plugin, ai, providers, contracts, security
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.19' }
  - { name: api, version: '>=1.0.21' }

compatibility:
  grav: ['2.0']

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Plugin status
      highlight: 1
      default: 1
      options: { 1: Enabled, 0: Disabled }
      validate: { type: bool }

    foundation:
      type: section
      title: Jarvis 0.3 reliable Admin2 assistant
      text: Jarvis adds bounded retries, optional private response caching, usage and estimated-cost reporting, opt-in budgets, and safe Markdown chunking. Proposals never save or publish a page; Accept updates only the current unsaved editor buffer. Provider credentials remain server-environment-only.
      underline: true

    admin.show_sidebar:
      type: toggle
      label: Show Jarvis assistant in Admin2
      highlight: 1
      default: 1
      options: { 1: Enabled, 0: Disabled }
      validate: { type: bool }

    admin.show_page_panel:
      type: toggle
      label: Show Jarvis in the page editor
      help: Users still need Jarvis and page permissions. Accept changes only the unsaved editor buffer.
      highlight: 1
      default: 1
      options: { 1: Enabled, 0: Disabled }
      validate: { type: bool }

    providers.openai.enabled:
      type: toggle
      label: OpenAI provider
      help: Registers the official OpenAI provider. A request still requires GRAV_JARVIS_OPENAI_API_KEY in the server process environment.
      highlight: 1
      default: 1
      options: { 1: Enabled, 0: Disabled }
      validate: { type: bool }

    providers.openai.default_model:
      type: text
      label: OpenAI default model
      help: Non-secret model identifier used when a provider-neutral request does not select a model. API credentials cannot be configured here.
      default: gpt-5.6-luna
      validate:
        required: true
        type: text

    providers.anthropic.enabled:
      type: toggle
      label: Anthropic provider
      help: Registers the official Anthropic provider. A request still requires GRAV_JARVIS_ANTHROPIC_API_KEY in the server process environment.
      highlight: 1
      default: 1
      options: { 1: Enabled, 0: Disabled }
      validate: { type: bool }

    providers.anthropic.default_model:
      type: text
      label: Anthropic default model
      help: Non-secret model identifier used when a provider-neutral request does not select a model. API credentials cannot be configured here.
      default: claude-sonnet-5
      validate:
        required: true
        type: text

    reliability_section:
      type: section
      title: Reliability and cost controls
      text: Retry behavior is bounded. Response caching and budgets are opt-in. Cost figures are estimates based only on operator-supplied versioned pricing; Jarvis never fetches pricing at runtime.
      underline: true

    reliability.retry.enabled:
      type: toggle
      label: Bounded transient retries
      highlight: 1
      default: 1
      options: { 1: Enabled, 0: Disabled }
      validate: { type: bool }

    reliability.retry.max_attempts:
      type: number
      label: Maximum attempts
      default: 3
      validate: { min: 1, max: 8 }

    reliability.cache.enabled:
      type: toggle
      label: Private response cache
      help: Disabled by default. Custom prompts are never cache-eligible.
      highlight: 0
      default: 0
      options: { 1: Enabled, 0: Disabled }
      validate: { type: bool }

    reliability.cache.ttl_seconds:
      type: number
      label: Cache lifetime in seconds
      default: 300
      validate: { min: 1, max: 86400 }

    reliability.cache.max_entries:
      type: number
      label: Maximum cache entries
      default: 128
      validate: { min: 1, max: 1024 }

    reliability.budgets.enabled:
      type: toggle
      label: Enforce configured budgets
      help: Unknown usage or pricing is reported as unknown and is never falsely treated as a known limit breach.
      highlight: 0
      default: 0
      options: { 1: Enabled, 0: Disabled }
      validate: { type: bool }

    reliability.budgets.max_request_count:
      type: number
      label: Maximum provider requests per operation
      validate: { min: 1, max: 1024 }

    reliability.budgets.max_input_bytes:
      type: number
      label: Maximum input bytes per request
      validate: { min: 1, max: 16777216 }

    reliability.budgets.max_estimated_output_units:
      type: number
      label: Maximum known output units per request
      help: Enforced only when the operation or provider-neutral request supplies a known output-unit bound.
      validate: { min: 1, max: 1000000000 }

    reliability.budgets.max_estimated_cost_per_request:
      type: text
      label: Maximum estimated cost per request
      help: Non-negative decimal amount in the configured pricing currency. Unknown pricing is reported, not falsely enforced.
      validate: { type: text }

    reliability.budgets.max_estimated_cost_per_operation:
      type: text
      label: Maximum estimated cost per operation
      help: Cumulative non-negative decimal bound for retries and chunk synthesis within one in-memory logical operation.
      validate: { type: text }

    reliability.budgets.max_retry_count:
      type: number
      label: Maximum retries per operation
      validate: { min: 0, max: 7 }

    reliability.chunking.max_chunk_bytes:
      type: number
      label: Maximum Markdown chunk bytes
      default: 12288
      validate: { min: 1024, max: 65536 }

    reliability.chunking.max_chunks:
      type: number
      label: Maximum chunks
      default: 16
      validate: { min: 1, max: 64 }
