name: Site Workshop
slug: site-workshop
type: plugin
version: 0.2.0
description: A modular Grav 2 workshop for safe icon output, external frontmatter, cache warming, and automation feeds.
icon: toolbox
author:
  name: Craig Daters
  email: craig@daters.net
homepage: https://github.com/cdaters/grav-extensions/tree/main/plugins/site-workshop
keywords: grav, plugin, admin2, svg, icons, shortcode, twig, cache, feed, frontmatter
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: api, version: '>=1.0.0' }

compatibility:
  grav: ['2.0']
  api: ['1.0']

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Plugin status
      highlight: 1
      default: 1
      options: { 1: Enabled, 0: Disabled }
      validate: { type: bool }

    admin.show_sidebar:
      type: toggle
      label: Show Admin2 sidebar item
      highlight: 1
      default: 1
      options: { 1: Yes, 0: No }
      validate: { type: bool }

    icon_section:
      type: section
      title: Icon Bench
      text: Search, preview, and safely render SVG icons through Twig or Shortcode Core.
      underline: true

    modules.icon_bench.enabled:
      type: toggle
      label: Enable Icon Bench
      highlight: 1
      default: 1
      options: { 1: Enabled, 0: Disabled }

    modules.icon_bench.default_pack:
      type: text
      label: Default icon pack
      default: workshop
      help: Used when an icon reference does not include a pack name.

    modules.icon_bench.custom_paths:
      type: array
      label: Custom icon-pack locations
      value_only: true
      default:
        - theme://images/icons
        - user://data/site-workshop/icons
      help: Each immediate subdirectory becomes a pack. SVG files are sanitized before output.

    modules.icon_bench.maximum_svg_bytes:
      type: number
      label: Maximum SVG file size in bytes
      default: 262144
      validate: { type: int, min: 1024, max: 1048576 }

    annex_section:
      type: section
      title: Frontmatter Annex
      text: Maintain reusable YAML frontmatter blocks outside page folders, then attach them to pages with explicit precedence.
      underline: true

    modules.frontmatter_annex.enabled:
      type: toggle
      label: Enable Frontmatter Annex
      highlight: 1
      default: 1
      options: { 1: Enabled, 0: Disabled }

    modules.frontmatter_annex.storage_path:
      type: text
      label: Annex storage location
      default: user://data/site-workshop/frontmatter
      help: Keep this under user://data unless you have a specific deployment requirement.

    modules.frontmatter_annex.default_precedence:
      type: select
      label: Default precedence
      default: page
      options:
        page: Page wins
        annex: Annex wins
      help: Individual pages can override this choice in their site_workshop frontmatter block.

    roadmap_section:
      type: section
      title: Planned modules
      text: Cache Hearth and Feed Relay are intentionally unavailable until their individual safety and compatibility work is complete.
      underline: true
