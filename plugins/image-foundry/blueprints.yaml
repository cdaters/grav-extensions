name: Image Foundry
slug: image-foundry
type: plugin
version: 0.1.0
description: Original-preserving, self-hosted responsive image derivatives for Grav 2.
icon: images
author:
  name: Craig Daters
  email: craig@daters.net
homepage: https://github.com/cdaters/grav-extensions/tree/main/plugins/image-foundry
keywords: grav, plugin, admin2, image, webp, avif, responsive, derivatives
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: api, version: '>=1.0.0' }

compatibility:
  grav: ['2.0']
  api: ['1.0']

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Plugin status
      highlight: 1
      default: 1
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool

    admin.show_sidebar:
      type: toggle
      label: Show Admin2 sidebar item
      highlight: 1
      default: 1
      options:
        1: Yes
        0: No
      validate:
        type: bool

    source_roots:
      type: array
      label: Source roots
      help: Paths are relative to the Grav root. Only images contained by these roots are cataloged.
      value_only: true

    source_extensions:
      type: array
      label: Source extensions
      help: Animated GIF is intentionally excluded because GD would flatten it.
      value_only: true

    widths:
      type: array
      label: Responsive widths
      help: Widths in pixels. Images are never enlarged.
      value_only: true

    formats.webp.enabled:
      type: toggle
      label: Generate WebP
      highlight: 1
      default: 1
      options:
        1: Yes
        0: No

    formats.webp.quality:
      type: number
      label: WebP quality
      default: 82
      validate:
        type: int
        min: 1
        max: 100

    formats.avif.enabled:
      type: toggle
      label: Generate AVIF
      highlight: 1
      default: 1
      options:
        1: Yes
        0: No

    formats.avif.quality:
      type: number
      label: AVIF quality
      default: 56
      validate:
        type: int
        min: 1
        max: 100

    max_source_bytes:
      type: number
      label: Maximum source bytes
      default: 52428800
      validate:
        type: int
        min: 1048576

    max_source_pixels:
      type: number
      label: Maximum decoded pixels
      default: 20000000
      validate:
        type: int
        min: 1000000

    build_limit:
      type: number
      label: Maximum sources per Admin build
      default: 50
      validate:
        type: int
        min: 1
        max: 500

    storage_path:
      type: text
      label: Protected generated-data directory
      help: Relative paths resolve from the Grav root. The directory must resolve outside the public Grav root so derivatives cannot bypass opaque delivery URLs.
      default: ../image-foundry-data
