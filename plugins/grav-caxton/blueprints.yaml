name: Caxton
slug: grav-caxton
type: plugin
version: 0.3.0
description: Source-faithful visual and source editing for Grav 2 and Admin2.
icon: pen-ruler
author:
  name: Craig Daters
  email: craig@daters.net
homepage: https://github.com/cdaters/grav-extensions/tree/main/plugins/grav-caxton
keywords: grav, plugin, admin2, editor, markdown, source, blocks
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }

compatibility:
  grav: ['2.0']

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Plugin status
      highlight: 1
      default: 1
      options: { 1: Enabled, 0: Disabled }
      validate: { type: bool }

    limits.max_source_bytes:
      type: number
      label: Maximum source document size in bytes
      help: Oversized documents fail safely without parsing or logging their content.
      default: 2097152
      validate: { type: int, min: 1024, max: 16777216 }

    admin.replace_markdown_fields:
      type: toggle
      label: Use Caxton for page Markdown fields
      help: Replaces page Markdown fields for users with Caxton permission. Ordinary Grav Save and Publish remain authoritative.
      highlight: 1
      default: 1
      options: { 1: Enabled, 0: Disabled }
      validate: { type: bool }

    admin.toolbar:
      type: array
      label: Toolbar items
      help: Ordered tools shown in Caxton. Add separator between groups. Unknown or unsafe items are ignored.
      value_only: true
      placeholder_value: undo, heading, bold, strikethrough, link, blockquote, bullet_list, ordered_list, code_block, source, or separator
      default:
        - undo
        - redo
        - separator
        - heading
        - separator
        - bold
        - italic
        - strikethrough
        - inline_code
        - remove_format
        - separator
        - link
        - blockquote
        - bullet_list
        - ordered_list
        - horizontal_rule
        - code_block
        - media
        - separator
        - jarvis
        - source

    jarvis.enabled:
      type: toggle
      label: Optional Jarvis actions
      help: Shows selection-aware AI actions only when Jarvis is installed and the user has both Caxton and Jarvis permissions. Caxton remains complete without Jarvis.
      highlight: 1
      default: 1
      options: { 1: Enabled, 0: Disabled }
      validate: { type: bool }
