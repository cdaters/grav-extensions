name: Site Safeguard
slug: site-safeguard
type: plugin
version: 0.2.3
description: Verified portable Grav backup packages, isolated staging, and rollback-first full-site restore for Grav 2.
icon: shield-halved
author:
  name: Craig Daters
  email: craig@daters.net
homepage: https://github.com/cdaters/grav-extensions/tree/main/plugins/site-safeguard
keywords: grav, plugin, admin2, backup, restore, deployment, manifest, checksum
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: api, version: '>=1.0.0' }

compatibility:
  grav: ['2.0']
  api: ['1.0']

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Plugin status
      highlight: 1
      default: 1
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool

    admin.show_sidebar:
      type: toggle
      label: Show Admin2 sidebar item
      highlight: 1
      default: 1
      options:
        1: Yes
        0: No
      validate:
        type: bool

    package_path:
      type: text
      label: Protected package directory
      help: Relative paths resolve from the Grav root. This directory must resolve outside the public Grav root.
      default: ../site-safeguard-packages

    stage_path:
      type: text
      label: Isolated staging directory
      help: Validated packages are extracted here and never over the running site. This directory must resolve outside the Grav root.
      default: ../site-safeguard-stage

    max_package_bytes:
      type: number
      label: Maximum package size in bytes
      default: 2147483648
      validate:
        type: int
        min: 1048576

    max_archive_entries:
      type: number
      label: Maximum ZIP entries
      default: 100000
      validate:
        type: int
        min: 100

    max_uncompressed_bytes:
      type: number
      label: Maximum uncompressed package size
      default: 5368709120
      validate:
        type: int
        min: 1048576

    allow_uploads:
      type: toggle
      label: Allow package imports in Admin2
      highlight: 1
      default: 1
      options:
        1: Yes
        0: No
      validate:
        type: bool

    max_packages:
      type: number
      label: Maximum retained packages
      help: Creation and import stop at this limit. Site Safeguard never auto-deletes a recovery package; an operator must explicitly remove an obsolete package.
      default: 12
      validate:
        type: int
        min: 1
        max: 100

    restore_enabled:
      type: toggle
      label: Allow full-site restore
      help: CLI restore requires a verified deployable stage, an exact confirmation phrase, and an automatically verified rollback package. No HTTP restore endpoint is exposed.
      highlight: 0
      default: 0
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool

    restore_boot_check:
      type: toggle
      label: Require fresh-process Grav boot checks
      help: Refuses restore when the staged site cannot boot in a separate PHP CLI process and automatically rolls back when the restored site fails the same check.
      highlight: 1
      default: 1
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool

    php_cli_path:
      type: text
      label: PHP CLI executable
      help: Executable used for isolated stage and post-restore boot checks. Usually php, /usr/bin/php, or the PHP CLI path supplied by your host.
      default: php

    restore_preserve_paths:
      type: array
      label: Host-local paths preserved during restore
      help: Relative to the Grav root. These paths remain local and override same-named paths in a transferred package. Keep .ddev here for development sites.
      value_only: true

    exclude_paths:
      type: array
      label: Paths excluded from every package
      help: Paths are relative to the Grav root. Security-critical exclusions such as the package/stage directories and macOS metadata are also enforced in code.
      value_only: true
